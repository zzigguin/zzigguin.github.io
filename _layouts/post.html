---
layout: default
---
{% assign slug = page.categories | first %}
{% assign s = site.data.series | where: "slug", slug | first %}
<article class="post">
  <header>
    {% if s %}<p class="kicker"><a href="{{ s.url | relative_url }}">{{ s.title }}</a></p>{% endif %}
    <h1>{{ page.title }}</h1>
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y년 %-m월 %-d일" }}</time></p>
  </header>
  <div class="body">
    {{ content }}
  </div>
</article>
