<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F4F1EA">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='7' width='20' height='20' rx='3' fill='%23F5CFD3' transform='rotate(-8 15 17)'/%3E%3Crect x='8' y='5' width='20' height='20' rx='3' fill='%23C9DFF0'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>

  <header class="top">
    <div class="col">
      <a class="brand" href="{{ '/' | relative_url }}">고흥닷컴</a>
      <nav aria-label="시리즈">
        {% for s in site.data.series %}
        <a class="nav-link s-{{ s.slug }}{% if page.series == s.slug or page.categories contains s.slug %} is-active{% endif %}" href="{{ s.url | relative_url }}">{{ s.title }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="foot">
    <div class="col">
      <a href="{{ '/feed.xml' | relative_url }}">RSS로 구독하기</a>
    </div>
  </footer>
</body>
</html>
